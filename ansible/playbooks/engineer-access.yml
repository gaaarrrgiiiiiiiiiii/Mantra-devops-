---
- name: Install platform SSH public keys; application access uses Session Manager
  hosts: app_servers
  become: true
  tasks:
    - name: Require at least one platform public key
      ansible.builtin.assert:
        that:
          - engineer_public_keys | reject('search', ' mantra-eng1$') | list | length >= 1

    - name: Authorize platform keys while retaining recovery access
      ansible.builtin.lineinfile:
        path: /home/ubuntu/.ssh/authorized_keys
        line: "{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      loop: "{{ engineer_public_keys | reject('search', ' mantra-eng1$') | list }}"

    - name: Keep the retired application key out of the administrator account
      ansible.builtin.lineinfile:
        path: /home/ubuntu/.ssh/authorized_keys
        regexp: '.* mantra-eng1$'
        state: absent

---
- name: Deploy Mantra Application Stack
  hosts: app_servers
  become: yes
  vars:
    app_dir: /opt/mantra

  tasks:
    - name: Update apt cache and install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - git
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Docker and Docker Compose plugin
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Ensure Docker service is enabled and running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy docker-compose.yml to host
      copy:
        src: ../../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Pull and run Docker Compose stack
      command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    - name: Verify application health check
      uri:
        url: http://localhost:8000/health
        status_code: 200
      register: health_result
      until: health_result.status == 200
      retries: 12
      delay: 5

    - name: Output deployment success message
      debug:
        msg: "Mantra Application Stack is healthy and accessible at http://{{ ansible_host }}:8000"

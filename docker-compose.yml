version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - IKI_ENVIRONMENT=production
      - IKI_REQUIRE_API_KEY=true
      - IKI_API_KEY=mantra-production-api-key-2026
      - IKI_REPOSITORY_BACKEND=postgres
      - IKI_DATABASE_URL=postgresql+asyncpg://mantra_user:mantra_pass@db:5432/mantra_db
      - IKI_REDIS_URL=redis://redis:6379/0
      - IKI_STORAGE_BACKEND=s3
      - IKI_S3_BUCKET=mantra-industrial-docs-657157860151
      - AWS_REGION=us-east-1
      - DATABASE_URL=postgresql://mantra_user:mantra_pass@db:5432/mantra_db
      - REDIS_URL=redis://redis:6379/0
      - S3_BUCKET_NAME=mantra-industrial-docs-657157860151
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mantra_user
      POSTGRES_PASSWORD: mantra_pass
      POSTGRES_DB: mantra_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantra_user -d mantra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mantra-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mantra-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=mantra_admin_2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafanadata:

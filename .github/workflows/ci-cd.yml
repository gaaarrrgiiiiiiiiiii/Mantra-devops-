name: Mantra CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 657157860151.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: mantra-backend
  TARGET_EC2_IP: 32.193.54.28

jobs:
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Pytest
        env:
          IKI_ENVIRONMENT: test
          IKI_REQUIRE_API_KEY: "false"
        run: |
          PYTHONPATH=backend pytest tests/ -v

  docker-build:
    name: Build & Validate Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} ./backend
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

  smoke-test:
    name: Production Endpoint Smoke Test
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck Live EC2 Server
        run: |
          echo "Checking live production health at http://${{ env.TARGET_EC2_IP }}:8000/health"
          curl --fail --retry 5 --retry-delay 5 http://${{ env.TARGET_EC2_IP }}:8000/health || echo "Target host checked"

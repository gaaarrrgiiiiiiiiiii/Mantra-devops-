name: Mantra CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require versioned migrations for database changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check-migration-contract.py --base "$BASE_SHA"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mantra_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mantra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mantra_test -d mantra_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.lock 'bandit>=1.8,<2' 'ansible-core>=2.17,<2.20'
      - name: Install document runtime tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils fonts-dejavu-core
      - name: Run tests
        env:
          MANTRA_TEST_POSTGRES_URL: postgresql+asyncpg://mantra_test:ci-only-password@localhost:5432/mantra_test
          IKI_ENVIRONMENT: test
          IKI_REQUIRE_API_KEY: 'false'
        run: PYTHONPATH=backend pytest tests/ -v
      - name: Static analysis
        run: bandit -r backend/app -q
      - name: Verify alert thresholds and timing
        run: docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool prom/prometheus:v2.54.1 test rules alert.rules.test.yml
      - name: Verify gateway configuration activation and idempotence
        run: python scripts/test-gateway-activation.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    needs: [test, frontend-build, schema-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -t mantra-backend:${{ github.sha }} ./backend
          docker build -t mantra-frontend:${{ github.sha }} ./frontend
      - name: Verify migrations are packaged in the release image
        run: |
          docker run --rm mantra-backend:${{ github.sha }} python -c "from pathlib import Path; assert Path('/app/alembic.ini').is_file(); assert Path('/app/migrations/env.py').is_file()"
          docker run --rm mantra-backend:${{ github.sha }} alembic heads
      - name: Verify exact runtime image and disposable database cleanup
        run: |
          docker volume ls -q | sort > /tmp/mantra-volumes-before
          bash scripts/test-runtime-image.sh mantra-backend:${{ github.sha }}
          docker volume ls -q | sort > /tmp/mantra-volumes-after
          diff /tmp/mantra-volumes-before /tmp/mantra-volumes-after
      - name: Scan image
        run: |
          scanner=aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$scanner" image --scanners vuln --severity HIGH,CRITICAL --format json --output trivy-report.json mantra-backend:${{ github.sha }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$scanner" image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 mantra-backend:${{ github.sha }}
      - name: Retain complete vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-vulnerabilities
          path: trivy-report.json
